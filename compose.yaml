# Generic deployment template; no live infrastructure addresses or credentials.
services:
  database:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: rtm
      POSTGRES_USER: rtm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ni kiriting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rtm -d rtm"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      APP_MODE: production
      NODE_ENV: production
      DATABASE_URL: postgresql://rtm:${POSTGRES_PASSWORD}@database:5432/rtm
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Yangi administrator paroli kerak}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:?Yangi TOTP siri kerak}
      SECURE_COOKIE: "1"
      TRUST_PROXY: "1"
      APP_ORIGIN: ${APP_ORIGIN:-https://rtm.example}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - uploads:/app/data
      - backups:/app/backups
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]
volumes:
  postgres_data:
  uploads:
  backups:
networks:
  backend:
    internal: true
  frontend:
