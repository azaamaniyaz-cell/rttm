# Generic deployment template. rtm.example is a documentation-only domain.
# Certificate files are operator-supplied and are not included in this repository.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
    listen 443 ssl;
    server_name rtm.example;
    ssl_certificate /etc/nginx/certs/rtm.crt;
    ssl_certificate_key /etc/nginx/certs/rtm.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    location = /api/auth/login {
        limit_req zone=login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
